name: Build Cross-Platform Standalone Executables

on:
  push:
    tags:
      - "v*"
      - "rp*"
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: mkvis3d-linux-x86_64
            dist_file: dist/mkvis3d-linux-x86_64
          - os: windows-latest
            artifact_name: mkvis3d-windows-x86_64.exe
            dist_file: dist/mkvis3d-windows-x86_64.exe
          - os: macos-latest
            artifact_name: mkvis3d-macos-app
            dist_file: dist/mkvis3d-macos-app.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --dev

      - name: Build Standalone Application
        run: uv run python scripts/build_app.py

      - name: Ensure macOS Zip Bundle
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ ! -f mkvis3d-macos-app.zip ]; then
            zip -r mkvis3d-macos-app.zip mkvis3d.app
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_file }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/rp')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mkvis3d-linux-x86_64/*
            mkvis3d-windows-x86_64.exe/*
            mkvis3d-macos-app/*
          body: |
            ### 📦 Download Packages
            - **Linux (x86_64):** `mkvis3d-linux-x86_64`
            - **Windows (x86_64):** `mkvis3d-windows-x86_64.exe`
            - **macOS (Universal / Apple Silicon):** `mkvis3d-macos-app.zip` (extraia o `mkvis3d.app`)

            ---

            ### ⚠️ Instrução importante para os usuários de Mac (Gatekeeper / Quarentena)

            Como o app ainda não possui uma assinatura paga de desenvolvedor Apple (notarização):
            Quando o usuário baixar o `.zip` pelo navegador e descompactar o `mkvis3d.app`, o macOS bloqueará a execução dizendo que *"o app não pôde ser verificado"*.

            **No macOS (primeira execução):**
            - Clique com o **botão direito (ou Control + clique)** sobre o `mkvis3d.app` e escolha **Abrir (Open)**.
            - Ou rode no Terminal:
              ```bash
              xattr -cr mkvis3d.app
              ```
          generate_release_notes: true
