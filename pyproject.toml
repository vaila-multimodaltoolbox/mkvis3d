[project]
name = "openbiomech"
version = "0.0.1"
description = "OpenBiomech (mkvis3d) — open-source Visual3D/Mokka alternative. Python prototype phase; see README.md for the long-term Rust architecture and CLAUDE.md for current status."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Paulo R. P. Santiago", email = "paulosantiago@usp.br" }]
keywords = ["biomechanics", "motion-analysis", "c3d", "kinematics"]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "ezc3d",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbiomech"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "NPY", "UP", "B", "C4", "SIM"]
ignore = ["E501", "N806", "N803"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [".git", ".venv", "__pycache__", "*.pyc", "build", "dist"]

[tool.pytest.ini_options]
